name: Build & Publish Signed GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Restore google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Restoring google-services.json from Base64 secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring google-services.json from raw secret..."
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          elif [ -f "app/google-services.json.template" ]; then
            echo "Restoring google-services.json from template..."
            cp app/google-services.json.template app/google-services.json
          fi

      - name: Decode Production Release Keystore from Secrets
        run: |
          if [ -z "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "ERROR: SIGNING_KEY_BASE64 secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "Decoding signed production keystore from GitHub Secrets..."
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > app/release.keystore
          echo "KEYSTORE_FILE=app/release.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release & Attach Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SplitUp Release ${{ github.ref_name }}
          body: |
            ## ⚡ What's New in ${{ github.ref_name }}
            
            - 📦 **Settled Group Archiving**: Option to archive fully settled groups and manage/unarchive them under the new "Archived" tab in Groups.
            - 🌑 **Enhanced Dashboard Quick Actions**: Full-screen dimming scrim when opening the `+` quick action menu for improved focus.
            - ✨ **UI Hygiene & Neutrality**: Removed check mark symbols across non-checkbox pages and neutralized settings sub-page backgrounds to prevent unwanted color tints.
            - 🛡️ **Refined Danger Zone & Settings**: Added clean error-tinted borders to Danger Zone cards and buttons in Data Management.
            - ⚡ **Optimized Performance & Build**: Upgraded build code with zero build warnings and verified stable compilation.
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
