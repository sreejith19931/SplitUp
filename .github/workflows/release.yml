name: Build & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SplitUp Release ${{ github.ref_name }}
          body: |
            ## ⚡ What's New in ${{ github.ref_name }}
            
            - 📦 **Settled Group Archiving**: Option to archive fully settled groups and manage/unarchive them under the new "Archived" tab in Groups.
            - 🌑 **Enhanced Dashboard Quick Actions**: Full-screen dimming scrim when opening the `+` quick action menu for improved focus.
            - ✨ **UI Hygiene & Neutrality**: Removed check mark symbols across non-checkbox pages and neutralized settings sub-page backgrounds to prevent unwanted color tints.
            - 🛡️ **Refined Danger Zone & Settings**: Added clean error-tinted borders to Danger Zone cards and buttons in Data Management.
            - ⚡ **Optimized Performance & Build**: Upgraded build code with zero build warnings and verified stable compilation.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
