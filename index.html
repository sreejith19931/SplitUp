<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitUp - Expense Sharing & Bill Splitting</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">💸</div>
        <h1>You're Invited to SplitUp!</h1>
        <p id="message">Scan or open this link inside the SplitUp app to view your group or add your friend.</p>
        <a id="openAppBtn" href="#" class="btn">Open in SplitUp App</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const groupId = urlParams.get('groupId');
        const email = urlParams.get('email');
        const name = urlParams.get('name');

        const messageEl = document.getElementById('message');
        const openAppBtn = document.getElementById('openAppBtn');

        let deepLink = "splitup://";

        if (groupId) {
            messageEl.innerText = `You have been invited to join a shared expense group on SplitUp.`;
            deepLink = `splitup://group/invite?id=${groupId}`;
        } else if (email) {
            messageEl.innerText = `Connect with ${name || email} on SplitUp to share expenses and settle debts easily.`;
            deepLink = `splitup://profile?email=${email}&name=${encodeURIComponent(name || '')}`;
        }

        openAppBtn.href = deepLink;

        // Auto-attempt to open app if installed
        window.onload = function() {
            setTimeout(function() {
                window.location.href = deepLink;
            }, 500);
        };
    </script>
</body>
</html>
