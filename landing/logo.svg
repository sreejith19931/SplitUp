<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
    <!-- Backing Ring -->
    <circle cx="54" cy="54" r="33" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Left Card Half (Cobalt Blue) -->
    <path fill="#1D4ED8" d="M26,38 H54 V70 H26 C23.8,70 22,68.2 22,66 V42 C22,39.8 23.8,38 26,38 Z" />

    <!-- Right Card Half (Emerald Green) -->
    <path fill="#047857" d="M54,38 H82 C84.2,38 86,39.8 86,42 V66 C86,68.2 84.2,70 82,70 H54 Z" />

    <!-- Gold Microchip -->
    <rect x="28" y="47" width="9" height="10" fill="#FBBF24" rx="1" />
    <rect x="30.5" y="49" width="4" height="6" fill="#78350F" rx="0.5" />

    <!-- Security Hologram -->
    <rect x="41" y="47" width="6" height="10" fill="#93C5FD" opacity="0.85" rx="1" />

    <!-- Contactless Payment Waves -->
    <path stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" d="M 72,48 A 5,5 0 0,1 72,56 M 75,45 A 8,8 0 0,1 75,59" />

    <!-- Perforated Tear Line -->
    <g fill="#38BDF8">
        <rect x="53.5" y="40" width="1" height="2" />
        <rect x="53.5" y="44" width="1" height="2" />
        <rect x="53.5" y="48" width="1" height="2" />
        <rect x="53.5" y="52" width="1" height="2" />
        <rect x="53.5" y="56" width="1" height="2" />
        <rect x="53.5" y="60" width="1" height="2" />
        <rect x="53.5" y="64" width="1" height="2" />
        <rect x="53.5" y="68" width="1" height="2" />
    </g>
</svg>
